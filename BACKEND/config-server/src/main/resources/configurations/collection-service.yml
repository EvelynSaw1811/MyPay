server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/ewallet_collection_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQL8Dialect

spring.cloud.openfeign.circuitbreaker.enabled: true

resilience4j:
  circuitbreaker:
    instances:
      notificationServiceCB:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
