server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/ewallet_currency_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQL8Dialect
  data:
    redis:
      host: localhost
      port: 6379

exchange-rate:
  api-url: https://open.er-api.com/v6/latest/USD
  cache-ttl-seconds: 3600

spring.cloud.openfeign.circuitbreaker.enabled: true
