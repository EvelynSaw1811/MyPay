# nginx reverse proxy for MyPay API — HTTPS termination
# Place on EC2 at /etc/nginx/conf.d/mypay.conf
# Replace YOUR_DUCKDNS_DOMAIN with e.g. mypay-demo.duckdns.org

server {
    listen 80;
    server_name YOUR_DUCKDNS_DOMAIN;

    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name YOUR_DUCKDNS_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DUCKDNS_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DUCKDNS_DOMAIN/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Proxy all requests to the Spring Cloud API Gateway
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE / long-polling support
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }
}
